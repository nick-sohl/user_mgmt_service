apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-mgmt.postgres.name" . }}
  labels:
    {{- include "user-mgmt.postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "user-mgmt.postgres.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
