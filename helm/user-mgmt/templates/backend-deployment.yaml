apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "user-mgmt.backend.name" . }}
  labels:
    {{- include "user-mgmt.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "user-mgmt.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user-mgmt.backend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "user-mgmt.postgres.name" . }}
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "user-mgmt.postgres.name" . }}
                  key: postgres-password
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "user-mgmt.backend.name" . }}
                  key: spring-datasource-url
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: {{ include "user-mgmt.backend.name" . }}
                  key: spring-jpa-hibernate-ddl-auto
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "user-mgmt.backend.name" . }}
                  key: jwt-issuer
            - name: JWT_EXPIRATION_MILLIS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "user-mgmt.backend.name" . }}
                  key: jwt-expiration-millis
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "user-mgmt.backend.name" . }}
                  key: jwt-secret
            - name: LETSENCRYPT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "user-mgmt.backend.name" . }}
                  key: letsencrypt-email
          {{- if .Values.backend.probes.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
