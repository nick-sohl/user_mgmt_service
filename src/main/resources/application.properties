spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

# Actuator + Prometheus (Aufgabe 1 Observability)
management.endpoints.web.exposure.include=health,info,prometheus,circuitbreakers,retries
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name:user-mgmt-service}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
spring.application.name=user-mgmt-service

# --- module_service client (Aufgabe 6) --------------------------------------
module-service.base-url=${MODULE_SERVICE_URL:http://module-service-prod.module-service-prod.svc.cluster.local:8080}
module-service.connect-timeout=500ms
module-service.read-timeout=2s

# Resilience4j – Retry
resilience4j.retry.instances.module-service.max-attempts=3
resilience4j.retry.instances.module-service.wait-duration=200ms
resilience4j.retry.instances.module-service.exponential-backoff-multiplier=2
resilience4j.retry.instances.module-service.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.module-service.ignore-exceptions=com.example.jwt.domain.module.ModuleNotFoundException,org.springframework.web.client.HttpClientErrorException$NotFound

# Resilience4j – Circuit Breaker
resilience4j.circuitbreaker.instances.module-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.module-service.sliding-window-size=20
resilience4j.circuitbreaker.instances.module-service.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.module-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.module-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.module-service.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.module-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.module-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.module-service.ignore-exceptions=com.example.jwt.domain.module.ModuleNotFoundException,org.springframework.web.client.HttpClientErrorException$NotFound

# Resilience4j – TimeLimiter (wall-clock budget for async path)
resilience4j.timelimiter.instances.module-service.timeout-duration=3s
resilience4j.timelimiter.instances.module-service.cancel-running-future=true
